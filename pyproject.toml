[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cut-obsidian-mcp"
version = "0.5.0"
description = "一体化第二大脑：记忆+纠错+总结+Obsidian嫁接+交接+技能沉淀+GitHub私有仓库实时同步 MCP 服务器（本地、免 API key、全 Agent 通用）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "jieba>=0.42.1",   # 中文分词（本地、免 key），FTS5 检索质量的关键
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cut-obsidian-mcp = "cut_obsidian_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cut_obsidian_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
